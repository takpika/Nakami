name: Release
# Push a tag like v1.0 to:
#   1. build the Developer ID app, notarize it and publish it as a GitHub release
#   2. build the App Store versions (iOS and the sandboxed Mac app) and upload them to App Store Connect
#
# Repository secrets (none of them can do more than sign and upload this team's apps):
#   DEVELOPER_ID_P12, DISTRIBUTION_P12, INSTALLER_P12   base64 of each certificate with its private key
#   CERTIFICATE_PASSWORD                                the password protecting those three files
#   DEVELOPER_ID_IDENTITY                               e.g. "Developer ID Application: Name (TEAMID)"
#   PROFILES_TGZ                                        base64 of a .tar.gz holding the App Store provisioning profiles
#   ASC_KEY_P8, ASC_KEY_ID, ASC_ISSUER                  App Store Connect API key (App Manager): notarization and upload
#   NAKAMI_TEAM                                         the team ID
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: xcode-27
    env:
      NAKAMI_TEAM: ${{ secrets.NAKAMI_TEAM }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER: ${{ secrets.ASC_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      # The tag gives the version (v1.0.1 -> 1.0.1) for every build below, in the store and on GitHub.
      - name: Version from the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "$v" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$' || { echo "tag $GITHUB_REF_NAME is not a version like v1.0.1"; exit 1; }
          echo "NAKAMI_VERSION=$v" >> "$GITHUB_ENV"
      - name: Tests
        run: Tests/run.sh 40
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Import certificates, profiles and the API key
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DISTRIBUTION_P12: ${{ secrets.DISTRIBUTION_P12 }}
          INSTALLER_P12: ${{ secrets.INSTALLER_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          PROFILES_TGZ: ${{ secrets.PROFILES_TGZ }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          for name in DEVELOPER_ID_P12 DISTRIBUTION_P12 INSTALLER_P12; do
            eval "printf %s \"\$$name\"" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
            rm "$RUNNER_TEMP/cert.p12"
          done
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          # Provisioning profiles, named by their UUID where Xcode looks for them.
          mkdir -p "$RUNNER_TEMP/profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf %s "$PROFILES_TGZ" | base64 --decode | tar -xz -C "$RUNNER_TEMP/profiles"
          for f in "$RUNNER_TEMP"/profiles/*; do
            uuid=$(security cms -D -i "$f" 2>/dev/null | plutil -extract UUID raw -)
            cp "$f" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.${f##*.}"
            cp "$f" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.${f##*.}"
          done
          rm -rf "$RUNNER_TEMP/profiles"
          printf %s "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc.p8"
          echo "ASC_KEY=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"
      - name: Developer ID build, notarized
        env:
          NAKAMI_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
        run: NOTARY_KEY="$ASC_KEY" NOTARY_KEY_ID="$ASC_KEY_ID" NOTARY_ISSUER="$ASC_ISSUER" scripts/release-mac.sh
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Nakami-*.zip --title "Nakami ${GITHUB_REF_NAME#v}" --generate-notes
      # Build numbers come from the date, so they always increase (also across builds uploaded by hand).
      - name: Choose the build number
        run: echo "NAKAMI_BUILD=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"
      - name: Upload the iOS app to App Store Connect
        run: scripts/store.sh ios upload
      - name: Upload the Mac app to App Store Connect
        run: scripts/store.sh mac upload
      - name: Remove the keys
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"; security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
